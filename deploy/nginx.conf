# Kuberpack Inquiry — nginx vhosts for:
#   - api.kuberpack.com        reverse-proxies to the whatsapp-webhook
#                               systemd service (127.0.0.1:8000)
#   - dashboard.kuberpack.com  serves dashboard/dist as a static SPA
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/kuberpack-inquiry
#          sudo ln -s /etc/nginx/sites-available/kuberpack-inquiry /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
#
# Written as plain HTTP (port 80) on purpose — this is the "certbot-ready"
# state. Once DNS for both hostnames resolves to this box, run:
#   sudo certbot --nginx -d api.kuberpack.com -d dashboard.kuberpack.com
# which edits this file in place to add the HTTPS server blocks and the
# HTTP -> HTTPS redirect (see deploy/README.md).

upstream whatsapp_webhook {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.kuberpack.com;

    location / {
        proxy_pass http://whatsapp_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.kuberpack.com;

    root /opt/kuberpack/inquiry/dashboard/dist;
    index index.html;

    # The dashboard has no login of its own (see CLAUDE.md) — on Vercel it
    # was gated by Edge Middleware (dashboard/middleware.js), which only
    # runs on Vercel's runtime and does nothing under nginx. This
    # auth_basic block is the equivalent stopgap gate here, so moving off
    # Vercel doesn't quietly leave enquiry data world-readable. Generate
    # the password file first (deploy/README.md) — nginx will 500 on every
    # request to this vhost until /etc/kuberpack/dashboard.htpasswd exists.
    auth_basic "Kuberpack Enquiry Log";
    auth_basic_user_file /etc/kuberpack/dashboard.htpasswd;

    location / {
        try_files $uri /index.html;
    }
}
